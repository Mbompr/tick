
name: Build Tick on Ubuntu

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  TICK_DEBUG: 0
  TICK_WERROR: 0

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64





    - name: pip
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install .[dev,plot]

    - name: build
      run: |
        python3 -m build --wheel

    - name: pytest
      run: |
        python3 -X faulthandler -m pytest -x -vv --durations=20 -o console_output_style=progress -o faulthandler_timeout=600
